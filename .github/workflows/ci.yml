name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install and run Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --verbose --redact

  test:
    name: Test on Linux (Nim ${{ matrix.nim_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nim_version: ["2.2.10", "2.2.0"]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nim (${{ matrix.nim_version }})
        uses: asdf-vm/actions/install@v4
        with:
          tool_versions: |
            nim ${{ matrix.nim_version }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r docs-requirements.txt
          pip install esphome

      - name: Run Nim unit tests
        run: |
          set -euo pipefail
          for t in tests/test_basic.nim tests/test_entities.nim tests/test_peripherals.nim tests/test_preferences.nim tests/test_dsp.nim tests/test_dsl.nim tests/test_examples.nim tests/test_freertos_ota.nim; do
            if [ -f "$t" ]; then
              echo "--- Running $t ---"
              nim c -r --path:src "$t"
              rm -f "${t%.nim}"
            fi
          done

      - name: Test embedded C++ code generation (Xtensa, RISC-V, ARM)
        run: |
          set -euo pipefail
          nim cpp --compileOnly --noMain:on --mm:arc -d:danger -d:useMalloc -d:esphome --cpu:esp --os:any --exceptions:goto --panics:on --path:src examples/blink/blink.nim
          nim cpp --compileOnly --noMain:on --mm:arc -d:danger -d:useMalloc -d:esphome --cpu:riscv32 --os:any --exceptions:goto --panics:on --path:src examples/blink/blink.nim
          nim cpp --compileOnly --noMain:on --mm:arc -d:danger -d:useMalloc -d:esphome --cpu:arm --os:any --exceptions:goto --panics:on --path:src examples/blink/blink.nim

      - name: Run Python component tests
        run: python -m unittest discover -s tests -p "test_*.py"
