esphome:
  name: nim-scheduler-demo
  friendly_name: "Nim Cooperative Scheduler Demo"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: INFO

api:

wifi:
  ap:
    ssid: "Scheduler-Fallback"

external_components:
  - source:
      type: local
      path: ../../components
    components: [nim]

nim:
  source: scheduler.nim
  nim_flags:
    - "-d:danger"
    - "-d:useMalloc"
    - "-d:esphome"

switch:
  - platform: template
    id: activity_led
    name: "Activity LED"
    optimistic: true

sensor:
  - platform: template
    id: telemetry_counter
    name: "Telemetry Counter"
    update_interval: 60s
