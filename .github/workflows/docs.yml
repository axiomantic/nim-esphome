name: Documentation

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  docs:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nim
        uses: asdf-vm/actions/install@v4
        with:
          tool_versions: |
            nim 2.2.10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install documentation dependencies
        run: |
          pip install -r docs-requirements.txt

      - name: Prepare Nim compiler libraries for docstrings
        run: |
          if command -v asdf >/dev/null 2>&1 && asdf which nim >/dev/null 2>&1; then
            NIM_BIN="$(asdf which nim)"
          else
            NIM_BIN="$(which nim)"
          fi
          NIM_REAL="$(readlink -f "$NIM_BIN" 2>/dev/null || echo "$NIM_BIN")"
          NIM_DIR="$(dirname "$(dirname "$NIM_REAL")")"
          if [ -d "$NIM_DIR/compiler" ] && [ ! -e "$NIM_DIR/lib/compiler" ]; then
            ln -sf "$NIM_DIR/compiler" "$NIM_DIR/lib/compiler" 2>/dev/null || true
          fi

      - name: Strict documentation build validation
        run: |
          zensical build --strict

      - name: Configure Git Author
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs on push to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -m1 -E '^version\s*=\s*"' nim_esphome.nimble | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')
          mike deploy --push --update-aliases dev latest
          if [ -n "$VERSION" ]; then
            mike deploy --push --update-aliases "$VERSION"
          fi
          mike set-default --push latest


      - name: Deploy versioned release docs on tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases "${VERSION}" latest
          mike set-default --push latest

      - name: Checkout gh-pages for GitHub Actions Pages deployment
        if: github.event_name != 'pull_request'
        run: |
          git checkout gh-pages

      - name: Upload artifact for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages (Actions)
        if: github.event_name != 'pull_request'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
