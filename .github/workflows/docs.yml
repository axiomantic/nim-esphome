name: Documentation

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  docs:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install documentation dependencies
        run: |
          pip install -r docs-requirements.txt

      - name: Strict documentation build validation
        run: |
          zensical build --strict

      - name: Configure Git Author
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy dev docs on push to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mike deploy --push dev
          if mike list | grep -q "latest"; then
            mike set-default --push latest
          else
            mike set-default --push dev
          fi

      - name: Deploy versioned release docs on tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases "${VERSION}" latest
          mike set-default --push latest

      - name: Checkout gh-pages for GitHub Actions Pages deployment
        if: github.event_name != 'pull_request'
        run: |
          git checkout gh-pages

      - name: Upload artifact for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages (Actions)
        if: github.event_name != 'pull_request'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
