name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Nim ${{ matrix.nim-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        nim-version: [ '2.0.x', '2.2.x', 'stable' ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Run Core Unit Tests
        run: |
          nim c -r --path:src tests/test_basic.nim

      - name: Test C++ Code Generation (ARC + useMalloc)
        run: |
          nim cpp --compileOnly --noMain:on --mm:arc -d:danger -d:useMalloc --path:src examples/blink/blink.nim
