name: CI
# Note: Push-triggered CI runs on self-hosted Forgejo Actions (.forgejo/workflows/ci.yml).
# GitHub Actions is retained for PRs and manual dispatch only.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install and run Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.0"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --verbose --redact

  test:
    name: Test on Linux (Nim 2.2 & latest)
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Nim (latest)
        uses: asdf-vm/actions/install@v4
        with:
          tool_versions: |
            nim 2.2.10

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r docs-requirements.txt
          pip install esphome

      - name: Test on Nim latest (2.2.10)
        run: |
          asdf set nim 2.2.10
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Test on Nim 2.2.0
        run: |
          asdf install nim 2.2.0
          asdf set nim 2.2.0
          ./scripts/build.sh
