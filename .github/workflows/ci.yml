name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Linux (Nim 2.2 & latest)
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nim (latest)
        uses: asdf-vm/actions/install@v4
        with:
          tool_versions: |
            nim 2.2.10

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r docs-requirements.txt
          pip install esphome

      - name: Test on Nim latest (2.2.10)
        run: |
          asdf set nim 2.2.10
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Test on Nim 2.2.0
        run: |
          asdf install nim 2.2.0
          asdf set nim 2.2.0
          ./scripts/build.sh
